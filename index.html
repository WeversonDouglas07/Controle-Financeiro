<head>

<script>try{var p=JSON.parse(localStorage.getItem("livro-diario:prefs")||"{}"),r=document.documentElement;if(p.tema==="claro")r.setAttribute("data-theme","light");else if(p.tema==="escuro")r.setAttribute("data-theme","dark");if(p.cor&&p.cor!=="verde")r.setAttribute("data-accent",p.cor)}catch(e){}</script>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" type="image/png" href="icon-192.png">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: app de uma coluna, cabeçalho fixo com mês, abas inferiores, folha de edição que sobe de baixo */
:root{
  --bg:#eef2ee; --surface:#ffffff; --surface-2:#f6f8f5; --ink:#16201b; --muted:#5d6a63; --line:#dce3dd;
  --accent:#0e6a4e; --accent-ink:#ffffff; --accent-soft:#dcefe6;
  --neg:#b02a1f; --neg-bg:#fbe7e4; --pos:#17733a; --pos-bg:#e0f2e6;
  --warn:#94570a; --warn-bg:#fdf0d9; --info:#2c568f; --info-bg:#e3ecf8;
  --shadow:0 1px 2px rgba(22,32,27,.06),0 4px 16px rgba(22,32,27,.06);
  --f-display:"Bricolage Grotesque","Inter",system-ui,sans-serif;
  --f-body:"Inter",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1210; --surface:#161d1a; --surface-2:#1c2521; --ink:#e4ebe7; --muted:#93a29a; --line:#29342f;
  --accent:#53c49c; --accent-ink:#052219; --accent-soft:#1d3a2f;
  --neg:#ff8f84; --neg-bg:#3a1f1c; --pos:#74d596; --pos-bg:#1a3324;
  --warn:#f3b552; --warn-bg:#3a2c14; --info:#8db6ee; --info-bg:#1b2a3f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1210; --surface:#161d1a; --surface-2:#1c2521; --ink:#e4ebe7; --muted:#93a29a; --line:#29342f;
  --accent:#53c49c; --accent-ink:#052219; --accent-soft:#1d3a2f;
  --neg:#ff8f84; --neg-bg:#3a1f1c; --pos:#74d596; --pos-bg:#1a3324;
  --warn:#f3b552; --warn-bg:#3a2c14; --info:#8db6ee; --info-bg:#1b2a3f;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 4px 16px rgba(0,0,0,.25); color-scheme:dark}


/* Cores de destaque escolhidas em Ajustes */
:root[data-accent="azul"]{--accent:#1f5aa6;--accent-ink:#ffffff;--accent-soft:#dde7f5}
@media (prefers-color-scheme:dark){:root[data-accent="azul"]:not([data-theme="light"]){--accent:#7fb0f0;--accent-ink:#071a33;--accent-soft:#1c2d47}}
:root[data-theme="dark"][data-accent="azul"]{--accent:#7fb0f0;--accent-ink:#071a33;--accent-soft:#1c2d47}
:root[data-accent="roxo"]{--accent:#6a3fb0;--accent-ink:#ffffff;--accent-soft:#ebe2f8}
@media (prefers-color-scheme:dark){:root[data-accent="roxo"]:not([data-theme="light"]){--accent:#b79af0;--accent-ink:#1d0d38;--accent-soft:#2e2347}}
:root[data-theme="dark"][data-accent="roxo"]{--accent:#b79af0;--accent-ink:#1d0d38;--accent-soft:#2e2347}
:root[data-accent="rosa"]{--accent:#b0325f;--accent-ink:#ffffff;--accent-soft:#f8e0e8}
@media (prefers-color-scheme:dark){:root[data-accent="rosa"]:not([data-theme="light"]){--accent:#f08cb0;--accent-ink:#3a0a1d;--accent-soft:#43202d}}
:root[data-theme="dark"][data-accent="rosa"]{--accent:#f08cb0;--accent-ink:#3a0a1d;--accent-soft:#43202d}
:root[data-accent="laranja"]{--accent:#b8570f;--accent-ink:#ffffff;--accent-soft:#fbe8d7}
@media (prefers-color-scheme:dark){:root[data-accent="laranja"]:not([data-theme="light"]){--accent:#f5a35a;--accent-ink:#3a1a02;--accent-soft:#41291a}}
:root[data-theme="dark"][data-accent="laranja"]{--accent:#f5a35a;--accent-ink:#3a1a02;--accent-soft:#41291a}
:root[data-accent="grafite"]{--accent:#2f3a40;--accent-ink:#ffffff;--accent-soft:#e2e6e8}
@media (prefers-color-scheme:dark){:root[data-accent="grafite"]:not([data-theme="light"]){--accent:#c9d3d8;--accent-ink:#13191c;--accent-soft:#2b3337}}
:root[data-theme="dark"][data-accent="grafite"]{--accent:#c9d3d8;--accent-ink:#13191c;--accent-soft:#2b3337}
.swatches{display:flex;flex-wrap:wrap;gap:12px 14px}
.sw{display:flex;flex-direction:column;align-items:center;gap:4px;border:0;background:transparent;padding:0;font-size:11.5px;color:var(--muted);font-weight:600}
.sw i{width:40px;height:40px;border-radius:999px;display:grid;place-items:center;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line);color:#fff}
.sw i svg{width:18px;height:18px;opacity:0}
.sw[aria-pressed=true]{color:var(--ink)}
.sw[aria-pressed=true] i{box-shadow:0 0 0 2px var(--ink)}
.sw[aria-pressed=true] i svg{opacity:1}
.opt .seg{margin-bottom:12px}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
body{margin:0;min-height:100dvh;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.4;-webkit-tap-highlight-color:transparent}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--surface)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px}
.top-in{max-width:640px;margin:0 auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.brand{display:flex;flex-direction:column;min-width:0}
.brand b{font-family:var(--f-display);font-size:19px;letter-spacing:-.01em;line-height:1.1}
.brand b,.brand small{white-space:nowrap}
@media (max-width:440px){.brand b{font-size:17px}.mnav span{min-width:76px!important}}
.brand small{color:var(--muted);font-size:12px}
.mnav{display:flex;align-items:center;gap:2px;background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:2px}
.mnav button{border:0;background:transparent;width:32px;height:32px;border-radius:999px;font-size:18px;line-height:1;color:var(--muted)}
.mnav button:hover{background:var(--line);color:var(--ink)}
.mnav span{min-width:108px;text-align:center;font-weight:600;font-size:14px;text-transform:capitalize}

main{max-width:640px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(150px + env(safe-area-inset-bottom,0px))}
section{display:flex;flex-direction:column;gap:14px}

.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:10px 12px;min-width:0}
.stat-l{display:block;color:var(--muted);font-size:11.5px;text-transform:uppercase;letter-spacing:.05em}
.stat-v{display:block;font-family:var(--f-display);font-size:17px;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.neg{color:var(--neg)} .pos{color:var(--pos)}

.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;overflow:hidden}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px 8px}
.card-h h2{margin:0;font-family:var(--f-display);font-size:16px;letter-spacing:-.01em}
.card-h .tot{font-weight:600}
.sub{color:var(--muted);font-size:12.5px}

.list{display:flex;flex-direction:column}
.row{display:flex;align-items:center;gap:10px;padding:11px 14px;border-top:1px solid var(--line);background:transparent;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left}
.row[role=button]:hover{background:var(--surface-2)}
.row-main{flex:1;min-width:0}
.row-t{font-weight:500;overflow-wrap:anywhere}
.row-m{color:var(--muted);font-size:12.5px;display:flex;flex-wrap:wrap;gap:4px 8px;margin-top:1px}
.row-v{text-align:right;white-space:nowrap;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.row-v strong{font-weight:600}
.row.auto{background:var(--surface-2)}

.pill{display:inline-flex;align-items:center;font-size:11px;font-weight:600;padding:2px 8px;border-radius:999px;border:0;white-space:nowrap;letter-spacing:.01em}
button.pill{cursor:pointer}
.p-ok{background:var(--pos-bg);color:var(--pos)} .p-bad{background:var(--neg-bg);color:var(--neg)}
.p-warn{background:var(--warn-bg);color:var(--warn)} .p-info{background:var(--info-bg);color:var(--info)}
.p-mute{background:var(--surface-2);color:var(--muted);border:1px solid var(--line)}
.chip{font-size:11.5px;color:var(--muted);background:var(--surface-2);border:1px solid var(--line);border-radius:6px;padding:0 6px}

.day-h{display:flex;flex-wrap:wrap;gap:2px 10px;justify-content:space-between;align-items:baseline;padding:10px 14px 4px;font-size:12.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em;font-weight:600}

.summary{background:var(--accent);color:var(--accent-ink);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px}
.summary .lbl{font-size:12px;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.summary .big{font-family:var(--f-display);font-size:32px;line-height:1.05;letter-spacing:-.02em}
.sum-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sum-grid div{background:rgba(255,255,255,.12);border-radius:10px;padding:8px 10px;min-width:0}
.sum-grid b{display:block;font-size:16px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar{height:8px;border-radius:99px;background:rgba(255,255,255,.22);overflow:hidden}
.bar i{display:block;height:100%;background:currentColor;border-radius:99px}
.bar-row{display:flex;justify-content:space-between;font-size:12.5px;margin-bottom:5px}

.breakdown{display:flex;flex-direction:column;gap:8px;padding:4px 14px 14px}
.bd{display:grid;grid-template-columns:110px 1fr auto;align-items:center;gap:10px;font-size:13px}
.bd .track{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden;border:1px solid var(--line)}
.bd .track i{display:block;height:100%;background:var(--accent)}

.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:8px 12px;font-weight:600;font-size:13.5px}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.btn.danger{color:var(--neg)}
.btn.danger.armed{background:var(--neg);color:#fff;border-color:var(--neg)}
.btn.sm{padding:4px 10px;font-size:12.5px;border-radius:8px}
.empty{padding:22px 16px;text-align:center;color:var(--muted);display:flex;flex-direction:column;gap:10px;align-items:center}
.empty b{color:var(--ink);font-weight:600}
.notice{background:var(--warn-bg);color:var(--warn);border-radius:12px;padding:12px 14px;font-size:13.5px}

.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:transparent;border-radius:7px;padding:7px 8px;font-weight:600;font-size:13.5px;color:var(--muted)}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:var(--shadow)}

.chk{width:26px;height:26px;flex:none;border-radius:8px;border:2px solid var(--line);background:var(--surface);display:grid;place-items:center;padding:0}
.chk[aria-checked=true]{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chk svg{width:14px;height:14px}
.row.done .row-t{text-decoration:line-through;color:var(--muted)}
.copy{border:0;background:transparent;color:var(--accent);font-size:12px;font-weight:600;padding:0}

.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
.tabs-in{max-width:640px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:4px}
.tabs button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 4px;border-radius:10px;color:var(--muted);font-size:12px;font-weight:600}
.tabs button svg{width:22px;height:22px}
.tabs button[aria-current=page]{color:var(--accent);background:var(--accent-soft)}
.fab{position:fixed;z-index:7;right:max(16px,calc(env(safe-area-inset-right,0px) + 16px));bottom:calc(78px + env(safe-area-inset-bottom,0px));
  height:52px;padding:0 20px 0 16px;border-radius:999px;border:0;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:15px;box-shadow:0 6px 20px color-mix(in srgb,var(--accent) 38%,transparent);display:flex;align-items:center;gap:6px}
.fab svg{width:22px;height:22px}

.scrim{position:fixed;inset:0;z-index:20;background:rgba(10,16,13,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--surface);width:100%;max-width:560px;max-height:92dvh;overflow:auto;border-radius:18px 18px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-top:8px;padding-bottom:calc(16px + env(safe-area-inset-bottom,0px))}
.grab{width:40px;height:4px;border-radius:9px;background:var(--line);margin:4px auto 10px}
.sheet h3{margin:0 0 12px;font-family:var(--f-display);font-size:20px}
.form{display:flex;flex-direction:column;gap:12px}
.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label,.flabel{font-size:12.5px;font-weight:600;color:var(--muted)}
.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);background:var(--surface-2);border-radius:10px;padding:10px 12px;font-size:16px;min-width:0}
.field input:focus,.field select:focus,.field textarea:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.field.money input{font-family:var(--f-display);font-size:26px;padding:8px 12px}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.toggle{display:flex;align-items:center;gap:10px;font-weight:500}
.toggle input{width:20px;height:20px;accent-color:var(--accent)}
.actions{display:flex;gap:8px;justify-content:space-between;margin-top:6px;flex-wrap:wrap}
.actions .right{display:flex;gap:8px;margin-left:auto}
.err{color:var(--neg);font-size:13px;min-height:0}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(140px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--bg);
  padding:9px 16px;border-radius:999px;font-size:14px;font-weight:500;box-shadow:var(--shadow);max-width:calc(100% - 32px)}
.top-r{display:flex;align-items:center;gap:8px}
.gear{border:1px solid var(--line);background:var(--surface-2);width:38px;height:38px;border-radius:999px;display:grid;place-items:center;color:var(--muted);padding:0}
.gear svg{width:20px;height:20px}
.gear.alert{color:var(--warn);border-color:var(--warn)}
.notice{display:flex;flex-direction:column;gap:8px;align-items:flex-start}
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--surface-2)}
.opt div{flex:1;min-width:0}
.opt b{display:block}
.opt p{margin:2px 0 8px;color:var(--muted);font-size:13px}
.mnav.off{visibility:hidden}
@media (max-width:440px){.stats{grid-template-columns:1fr 1fr}.stats .stat:nth-child(3){grid-column:1/-1;display:flex;justify-content:space-between;align-items:baseline;gap:8px}}
@media (max-width:380px){.mnav span{min-width:92px;font-size:13px}}
@media (max-width:380px){.stat-v{font-size:15px}.bd{grid-template-columns:86px 1fr auto}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}}}
</style>
</head>
<body>
<header class="top"><div class="top-in">
  <div class="brand"><b>Controle mensal</b><small id="clock" class="num">—</small></div>
  <div class="top-r">
  <div class="mnav" id="mnav">
    <button id="mprev" aria-label="Mês anterior">‹</button>
    <span id="mlabel">—</span>
    <button id="mnext" aria-label="Próximo mês">›</button>
  </div>
  <button class="gear" id="gear" aria-label="Ajustes e backup"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg></button>
  </div>
</div></header>

<main>
  <div id="notice" class="notice" hidden></div>
  <section id="v-registro"></section>
  <section id="v-mes" hidden></section>
  <section id="v-provisoes" hidden></section>
</main>

<button class="fab" id="fab"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span id="fabtxt">Registrar</span></button>

<nav class="tabs" aria-label="Seções"><div class="tabs-in">
  <button data-tab="registro" id="t-registro"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2z"/><path d="M9 8h6M9 12h6"/></svg>Registro</button>
  <button data-tab="mes" id="t-mes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>Mês</button>
  <button data-tab="provisoes" id="t-provisoes"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 11l3 3 8-8"/><path d="M20 12v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h9"/></svg>Provisões</button>
</div></nav>

<div id="scrim" class="scrim" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheet-title"></div></div>
<div id="toast" class="toast" hidden role="status"></div>
<script src="xlsx.mini.min.js"></script>

<script>
(function(){
const FORMAS=["Pix","Cartão de crédito","Débito","Dinheiro","Caju","VT"];
const MESES=["janeiro","fevereiro","março","abril","maio","junho","julho","agosto","setembro","outubro","novembro","dezembro"];
const SEM=["dom","seg","ter","qua","qui","sex","sáb"];
const BRL=new Intl.NumberFormat("pt-BR",{style:"currency",currency:"BRL"});
const $=s=>document.querySelector(s);
const pad=n=>String(n).padStart(2,"0");
const isoOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const todayISO=()=>isoOf(new Date());
const monthOf=d=>d.getFullYear()+"-"+pad(d.getMonth()+1);
const fromISO=s=>{const[y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
function shiftMonth(k,n){let[y,m]=k.split("-").map(Number);m+=n;while(m>12){m-=12;y++}while(m<1){m+=12;y--}return y+"-"+pad(m)}
const mesLabel=k=>{const[y,m]=k.split("-");return MESES[+m-1]+" "+y};
const dBR=s=>{if(!s)return"—";const[y,m,d]=s.split("-");return d+"/"+m+"/"+y};
const dShort=s=>{if(!s)return"—";const[,m,d]=s.split("-");return d+"/"+m};
const sum=a=>Math.round(a.reduce((t,x)=>t+(+x.valor||0),0)*100)/100;

    for(const addr in ws){if(addr[0]==="!")continue;const c=ws[addr];if(typeof c.v==="number"&&cols[X.utils.decode_cell(addr).c]==="Valor")c.z='"R$" #,##0.00'}X.utils.book_append_sheet(wb,ws,nome)};

async function exportar(){

        if(p.quitado)chk.innerHTML=CHECK;
        const para=p.para?h("span",{},p.para," ",h("button",{class:"copy",onclick:e=>{e.stopPropagation();copiar(p.para)}},"Copiar")):null;
        l.append(clickable(h("div",{class:"row"+(p.quitado?" done":"")},chk,
          h("div",{class:"row-main"},h("div",{class:"row-t"},p.descricao||"—"),h("div",{class:"row-m"},para,p.parcelas>1?h("span",{class:"chip"},p.parcelas+" parcelas"):null)),
          h("div",{class:"row-v"},h("strong",{class:"num "+(rec?"pos":"neg")},(rec?"+ ":"− ")+money(p.valor)),h("span",{class:"pill "+(rec?"p-ok":"p-bad")},rec?"A receber":"A pagar"))),()=>openSheet("prov",p)));
      });
      card.append(l);
    }
  }
  root.append(card);
}
async function copiar(txt){
  const chave=String(txt).replace(/\s*\(PIX\)\s*/i,"").trim();
  try{await navigator.clipboard.writeText(chave);toast("Copiado: "+chave)}catch(e){toast(chave)}
}

/* ---------- Folha de edição ---------- */
function seg(name,opts,val,onchange){
  const wrap=h("div",{class:"seg",role:"group"});const input=h("input",{type:"hidden",name,value:val});
  opts.forEach(([k,l])=>wrap.append(h("button",{type:"button","aria-pressed":String(k===val),onclick:e=>{input.value=k;wrap.querySelectorAll("button").forEach(b=>b.setAttribute("aria-pressed",String(b===e.currentTarget)));onchange&&onchange(k)}},l)));
  wrap.append(input);return wrap;
}
const field=(id,label,control,cls)=>h("div",{class:"field "+(cls||"")},h("label",{for:id},label),control);
const inp=(id,name,attrs)=>h("input",{id,name,...attrs});

function openSheet(kind,item,preset){
  const it=item||{};const novo=!item;const sheet=$("#sheet");sheet.replaceChildren(h("div",{class:"grab"}));
  const form=h("form",{class:"form",novalidate:true});
  const err=h("div",{class:"err",role:"alert"});
  let titulo="";
  const valorStr=it.valor!=null?String(it.valor).replace(".",","):"";
  if(kind==="registro"){
    titulo=novo?"Registrar":"Editar registro";
    const parc=field("f-parc","Parcelas",inp("f-parc","parcelas",{type:"number",inputmode:"numeric",min:"1",max:"48",value:it.parcelas||1}));
    const sel=h("select",{id:"f-forma",name:"forma",onchange:e=>parc.hidden=e.target.value!=="Cartão de crédito"},FORMAS.map(f=>h("option",{value:f,selected:(it.forma||"Pix")===f},f)));
    parc.hidden=(it.forma||"Pix")!=="Cartão de crédito";
    form.append(seg("tipo",[["gasto","Gasto"],["ganho","Ganho"]],it.tipo||"gasto"),
      field("f-valor","Valor (R$)",inp("f-valor","valor",{inputmode:"decimal",placeholder:"0,00",value:valorStr,autocomplete:"off"}),"money"),
      field("f-desc","Descrição",inp("f-desc","descricao",{placeholder:"Ex.: Mercado, padaria, Uber",value:it.descricao||"",autocomplete:"off"})),
      h("div",{class:"two"},field("f-data","Data",inp("f-data","data",{type:"date",value:it.data||S.today})),field("f-forma","Forma de pagamento",sel)),parc);
  }else if(kind==="lanc"){
    const tipo=it.tipo||(preset&&preset.tipo)||"despesa";
    titulo=novo?"Novo lançamento · "+mesLabel(it.mes||S.mes):"Editar lançamento";
    const lblData=h("label",{for:"f-data"},tipo==="entrada"?"Data do crédito":"Vencimento");
    const lblPago=h("span",{},tipo==="entrada"?"Já recebi":"Já paguei");
    form.append(seg("tipo",[["entrada","Entrada"],["despesa","Despesa"]],tipo,k=>{lblData.textContent=k==="entrada"?"Data do crédito":"Vencimento";lblPago.textContent=k==="entrada"?"Já recebi":"Já paguei"}),
      field("f-valor","Valor (R$)",inp("f-valor","valor",{inputmode:"decimal",placeholder:"0,00",value:valorStr,autocomplete:"off"}),"money"),
      field("f-desc","Descrição",inp("f-desc","descricao",{placeholder:"Ex.: Salário, Energia elétrica",value:it.descricao||"",autocomplete:"off"})),
      h("div",{class:"two"},h("div",{class:"field"},lblData,inp("f-data","data",{type:"date",value:it.data||""})),
        field("f-nota","Observação",inp("f-nota","nota",{placeholder:"Ex.: Benefício",value:it.nota||""}))),
      h("label",{class:"toggle"},h("input",{type:"checkbox",name:"pago",checked:!!it.pago}),lblPago));
  }else{
    titulo=novo?"Nova provisão":"Editar provisão";
    form.append(seg("tipo",[["pagar","A pagar"],["receber","A receber"]],it.tipo||"pagar"),
      field("f-valor","Valor (R$)",inp("f-valor","valor",{inputmode:"decimal",placeholder:"0,00",value:valorStr,autocomplete:"off"}),"money"),
      field("f-desc","Descrição",inp("f-desc","descricao",{placeholder:"Ex.: Conta de água, Empréstimo",value:it.descricao||"",autocomplete:"off"})),
      field("f-para","Para / de quem (chave Pix, conta…)",inp("f-para","para",{placeholder:"Ex.: 11999999999 (PIX)",value:it.para||""})),
      h("div",{class:"two"},field("f-data","Data do pagamento",inp("f-data","data",{type:"date",value:it.data||""})),
        field("f-parc","Parcelas",inp("f-parc","parcelas",{type:"number",inputmode:"numeric",min:"0",max:"48",value:it.parcelas||0}))),
      h("label",{class:"toggle"},h("input",{type:"checkbox",name:"quitado",checked:!!it.quitado}),"Já quitada"));
  }
  const del=novo?null:h("button",{type:"button",class:"btn danger",onclick:async e=>{
    const b=e.currentTarget;if(!b.classList.contains("armed")){b.classList.add("armed");b.textContent="Confirmar exclusão";return}
    if(await apagar(kind,it.id)){closeSheet();toast("Excluído")}}},"Excluir");
  form.append(err,h("div",{class:"actions"},del,h("div",{class:"right"},h("button",{type:"button",class:"btn",onclick:closeSheet},"Cancelar"),h("button",{type:"submit",class:"btn primary"},"Salvar"))));
  form.addEventListener("submit",async e=>{
    e.preventDefault();const fd=new FormData(form);const valor=parseValor(fd.get("valor"));const desc=String(fd.get("descricao")||"").trim();
    if(!(valor>0)){err.textContent="Informe um valor maior que zero.";$("#f-valor").focus();return}
    if(!desc){err.textContent="Escreva uma descrição.";$("#f-desc").focus();return}
    const now=new Date().toISOString();let obj;
    if(kind==="registro"){const forma=fd.get("forma");obj={tipo:fd.get("tipo"),valor,descricao:desc,data:fd.get("data")||S.today,forma,parcelas:forma==="Cartão de crédito"?Math.max(1,parseInt(fd.get("parcelas"))||1):1}}
    else if(kind==="lanc"){obj={mes:it.mes||S.mes,tipo:fd.get("tipo"),valor,descricao:desc,data:fd.get("data")||"",nota:String(fd.get("nota")||"").trim(),pago:fd.get("pago")==="on"}}
    else{obj={tipo:fd.get("tipo"),valor,descricao:desc,para:String(fd.get("para")||"").trim(),data:fd.get("data")||"",parcelas:Math.max(0,parseInt(fd.get("parcelas"))||0),quitado:fd.get("quitado")==="on"}}
    obj.criadoEm=it.criadoEm||now;obj.atualizadoEm=now;
    const btn=form.querySelector("[type=submit]");btn.disabled=true;btn.textContent="Salvando…";
    if(await salvar(kind,it.id,obj)){closeSheet();toast(novo?"Salvo":"Alterações salvas");if(kind==="registro"&&novo&&obj.data.slice(0,7)!==S.mes){S.mes=obj.data.slice(0,7);render()}}
    else{btn.disabled=false;btn.textContent="Salvar"}
  });
  sheet.append(h("h3",{id:"sheet-title"},titulo),form);
  $("#scrim").hidden=false;
  setTimeout(()=>{const v=$("#f-valor");if(v&&novo)v.focus()},60);
}
function closeSheet(){$("#scrim").hidden=true;$("#sheet").replaceChildren()}
$("#scrim").addEventListener("click",e=>{if(e.target.id==="scrim")closeSheet()});
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&!$("#scrim").hidden)closeSheet()});

/* ---------- Navegação ---------- */
const TABS={registro:"Registrar",mes:"Lançamento",provisoes:"Provisão"};
function go(tab){if(!TABS[tab])tab="registro";S.tab=tab;if(location.hash!=="#"+tab)history.replaceState(null,"","#"+tab);render()}
document.querySelectorAll(".tabs button").forEach(b=>b.addEventListener("click",()=>go(b.dataset.tab)));
window.addEventListener("resize",()=>{clearTimeout(window.__rz);window.__rz=setTimeout(render,150)});
window.addEventListener("hashchange",()=>go(location.hash.slice(1)));
$("#mprev").onclick=()=>{S.mes=shiftMonth(S.mes,-1);render()};
$("#mnext").onclick=()=>{S.mes=shiftMonth(S.mes,1);render()};
$("#fab").onclick=()=>{if(S.tab==="registro")openSheet("registro");else if(S.tab==="mes")openSheet("lanc",null,{tipo:"despesa"});else openSheet("prov")};

function tickClock(){
  const d=new Date();$("#clock").textContent=SEM[d.getDay()]+", "+d.getDate()+" "+MESES[d.getMonth()].slice(0,3)+" · "+pad(d.getHours())+":"+pad(d.getMinutes());
  const t=todayISO();if(t!==S.today){S.today=t;render()}
}
function render(){
  for(const t of Object.keys(TABS)){$("#v-"+t).hidden=S.tab!==t;const b=$("#t-"+t);if(S.tab===t)b.setAttribute("aria-current","page");else b.removeAttribute("aria-current")}
  $("#mnav").style.visibility=S.tab==="provisoes"?"hidden":"visible";
  $("#mlabel").textContent=innerWidth<440?(()=>{const[y,m]=S.mes.split("-");return MESES[+m-1].slice(0,3)+" "+y})():mesLabel(S.mes);$("#fabtxt").textContent=TABS[S.tab];
  renderAviso();
  if(S.tab==="registro")renderRegistro();else if(S.tab==="mes")renderMes();else renderProv();
}
function renderAviso(){
  const n=$("#notice"),g=$("#gear");n.replaceChildren();
  const tot=S.reg.length+S.lan.length+S.prov.length;
  const dias=S.meta.ultimoBackup?Math.floor((Date.now()-new Date(S.meta.ultimoBackup))/864e5):null;
  const atrasado=tot>0&&(dias===null||dias>=7);
  g.classList.toggle("alert",atrasado);
  if(!tot){n.append(h("b",{},"Primeira vez aqui?"),h("span",{},"Se você recebeu um arquivo de backup, restaure-o para trazer seus lançamentos. Ou comece a registrar direto."),h("button",{class:"btn sm",onclick:abrirBackup},"Restaurar backup"));n.hidden=false}
  else if(atrasado){n.append(h("span",{},dias===null?"Você ainda não fez nenhum backup. Os dados ficam só neste celular.":"Seu último backup foi há "+dias+" dias."),h("button",{class:"btn sm",onclick:exportar},"Fazer backup agora"));n.hidden=false}
  else n.hidden=true;
}
$("#gear").onclick=abrirBackup;
const PREFKEY="livro-diario:prefs";
const CORES=[["verde","Verde","#0e6a4e"],["azul","Azul","#1f5aa6"],["roxo","Roxo","#6a3fb0"],["rosa","Rosa","#b0325f"],["laranja","Laranja","#b8570f"],["grafite","Grafite","#2f3a40"]];
let PREF={};try{PREF=JSON.parse(localStorage.getItem(PREFKEY)||"{}")||{}}catch(e){PREF={}}
function aplicarPrefs(){
  const r=document.documentElement;
  if(PREF.tema==="claro")r.setAttribute("data-theme","light");else if(PREF.tema==="escuro")r.setAttribute("data-theme","dark");else r.removeAttribute("data-theme");
  if(PREF.cor&&PREF.cor!=="verde")r.setAttribute("data-accent",PREF.cor);else r.removeAttribute("data-accent");
  const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute("content",getComputedStyle(r).getPropertyValue("--surface").trim()||"#ffffff");
}
function salvarPrefs(){try{localStorage.setItem(PREFKEY,JSON.stringify(PREF))}catch(e){}aplicarPrefs()}
aplicarPrefs();
try{matchMedia("(prefers-color-scheme: dark)").addEventListener("change",aplicarPrefs)}catch(e){}

/* ---------- Início ---------- */
carregar();
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
if("serviceWorker" in navigator&&location.protocol==="https:")navigator.serviceWorker.register("sw.js").catch(()=>{});
document.addEventListener("visibilitychange",()=>{if(!document.hidden)tickClock()});
S.tab=TABS[location.hash.slice(1)]?location.hash.slice(1):"registro";
tickClock();setInterval(tickClock,30000);
render();
})();
</script>
